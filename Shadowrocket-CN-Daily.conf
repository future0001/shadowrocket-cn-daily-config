# 中国大陆日用 · Shadowrocket
# 参考 Johnshall/Shadowrocket-ADBlock-Rules-Forever 的 lazy_group.conf 与 sr_cnip.conf
# 节点从 Shadowrocket 首页已有节点读取。
[General]
bypass-system = true
skip-proxy = localhost, *.local, *.lan, captive.apple.com
dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT
# 代理连接遇到 QUIC 时允许应用回退到 TCP，国内直连保留 QUIC。
block-quic = all-proxy

[Proxy Group]
境外出口 = select,PROXY,自动回退,policy-select-name=PROXY
自动回退 = fallback,policy-regex-filter=.+,interval=600,timeout=5,url=https://www.gstatic.com/generate_204
未分类流量 = select,境外出口,DIRECT,policy-select-name=境外出口
微信 = select,DIRECT,境外出口,policy-select-name=DIRECT
腾讯视频 = select,DIRECT,境外出口,policy-select-name=DIRECT
QQ = select,DIRECT,境外出口,policy-select-name=DIRECT
腾讯共享 = select,DIRECT,境外出口,policy-select-name=DIRECT
爱奇艺 = select,DIRECT,境外出口,policy-select-name=DIRECT
优酷 = select,DIRECT,境外出口,policy-select-name=DIRECT
